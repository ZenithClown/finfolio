# PostgREST INI File Configuration
#
# ..versionchanged:: 2026-06-07 [B8] switched `db-anon-role` from
# `postgres` (cluster superuser) to `web_anon` (least-privilege role
# created in database/security/roles.sql). The `db-uri` is now expected
# to connect as `authenticator`, which holds membership in `web_anon`
# and `web_user` and switches into whichever role the JWT `role` claim
# names (or `web_anon` when no JWT is presented).
#
# Example PGRST_DB_URI for local dev:
#   postgres://authenticator:authenticator@localhost:5432/finfolio
#
# `jwt-secret` MUST be at least 32 characters; supply via env var so it
# never lands in source control. PostgREST verifies HS256 signatures
# produced by `base.jwt_sign` (see database/security/jwt.sql).
#
# `db-max-rows` caps every implicit SELECT to defend against accidental
# full-table scans from the dashboard.

db-uri       = "env:PGRST_DB_URI"
db-schemas   = "api"
db-anon-role = "web_anon"
db-max-rows  = 1000
jwt-secret   = "env:PGRST_JWT_SECRET"
server-port  = 3100
