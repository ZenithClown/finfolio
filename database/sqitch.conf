[core]
	engine = pg
	# All paths resolve relative to this file (database/), so deploy/, revert/, verify/
	# sit alongside sqitch.plan as sqitch expects.
	plan_file = sqitch.plan
	top_dir = .

[engine "pg"]
	# Default target for local development. Override on the CLI with
	#   sqitch deploy db:pg://user:pass@host:port/db
	# or by adding a [target "name"] block.
	target = db:pg://postgres:postgres@finfolio_pg:5432/finfolio
	registry = sqitch
	client = psql

[user]
	name = finfolio dev
	email = noreply@finfolio.local

[deploy]
	verify = true

[rebase]
	verify = true
